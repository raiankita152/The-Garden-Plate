
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery</title>
    <meta name="description" content="Explore The Garden Plate's food, ambience, restaurant facade, and events gallery.">

    <link rel="icon" type="image/png" href="./images/favicon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Shared CSS -->
    <link rel="stylesheet" href="./style.css">

    <!-- Shared Components -->
    <script src="./js/components.js" defer></script>

    <!-- Gallery Functionality -->
    <script src="./js/gallery.js" defer></script>
</head>

<body class="font-secondary bg-white">

    <!-- Shared Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Hero Section -->
    <section class="relative h-[450px] md:h-[350px] overflow-hidden">

        <img
            src="./images/Gallery Banner.png"
            alt="The Garden Plate restaurant gallery"
            class="absolute inset-0 w-full h-full object-cover"
            fetchpriority="high"
        >

        <div class="absolute inset-0 bg-black/45"></div>

        <div class="relative z-10 flex flex-col items-center justify-center h-full text-center px-6">

            <h1 class="font-primary text-[#FFF0D2] text-5xl md:text-7xl font-bold">
                Gallery
            </h1>

            <div class="flex items-center justify-center gap-3 mt-4">
                <div class="w-20 h-[2px] bg-[#FFF0D2]"></div>

                <img
                    src="./images/G_Vector.png"
                    alt=""
                    aria-hidden="true"
                    class="w-7 h-8"
                >

                <div class="w-20 h-[2px] bg-[#FFF0D2]"></div>
            </div>

            <p class="text-[#FFF0D2] text-lg md:text-2xl mt-4">
                A glimpse into our world of flavor, elegance, and unforgettable moments.
            </p>

        </div>
    </section>

    <!-- Gallery Section -->
    <main>
        <section id="gallery" class="max-w-7xl mx-auto px-4 md:px-6 py-16">

            <h2 class="font-primary text-3xl md:text-4xl text-center text-[#153E17] mb-8">
                Our Gallery
            </h2>

            <!-- Category Filters -->
            <div
                id="gallery-filters"
                class="flex flex-wrap items-center justify-center gap-3 mb-10"
                aria-label="Filter gallery photos"
            >
                <button type="button" data-filter="all" aria-pressed="true"
                    class="filter-btn active-filter px-6 py-2 rounded-md text-sm font-secondary font-semibold tracking-wide transition duration-300">
                    ALL
                </button>

                <button type="button" data-filter="facade" aria-pressed="false"
                    class="filter-btn px-6 py-2 rounded-md text-sm font-secondary font-semibold tracking-wide transition duration-300">
                    FACADE
                </button>

                <button type="button" data-filter="food" aria-pressed="false"
                    class="filter-btn px-6 py-2 rounded-md text-sm font-secondary font-semibold tracking-wide transition duration-300">
                    FOOD
                </button>

                <button type="button" data-filter="ambience" aria-pressed="false"
                    class="filter-btn px-6 py-2 rounded-md text-sm font-secondary font-semibold tracking-wide transition duration-300">
                    AMBIENCE
                </button>

                <button type="button" data-filter="events" aria-pressed="false"
                    class="filter-btn px-6 py-2 rounded-md text-sm font-secondary font-semibold tracking-wide transition duration-300">
                    EVENTS
                </button>
            </div>

            <!-- Photos are generated by gallery.js -->
            <div
                id="gallery-grid"
                class="grid grid-cols-2 md:grid-cols-6 gap-4 md:gap-5"
                aria-live="polite"
            ></div>

            <p id="gallery-empty" class="hidden text-center text-gray-500 py-10">
                No photos found in this category.
            </p>

        </section>
    </main>

    <!-- Lightbox -->
    <div
        id="lightbox"
        class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/90 backdrop-blur-sm px-4"
        role="dialog"
        aria-modal="true"
        aria-label="Gallery image viewer"
    >

        <button
            id="lightbox-close"
            type="button"
            aria-label="Close image viewer"
            class="absolute top-5 right-5 md:top-8 md:right-8 text-white/80 hover:text-[#A6833E] transition duration-300 z-10"
        >
            <svg class="w-9 h-9" fill="none" stroke="currentColor"
                stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>

        <button
            id="lightbox-prev"
            type="button"
            aria-label="Previous image"
            class="absolute left-2 md:left-8 top-1/2 -translate-y-1/2 text-white/80 hover:text-[#A6833E] transition duration-300 z-10"
        >
            <svg class="w-10 h-10 md:w-12 md:h-12" fill="none"
                stroke="currentColor" stroke-width="1.5"
                viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15 19l-7-7 7-7"/>
            </svg>
        </button>

        <button
            id="lightbox-next"
            type="button"
            aria-label="Next image"
            class="absolute right-2 md:right-8 top-1/2 -translate-y-1/2 text-white/80 hover:text-[#A6833E] transition duration-300 z-10"
        >
            <svg class="w-10 h-10 md:w-12 md:h-12" fill="none"
                stroke="currentColor" stroke-width="1.5"
                viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 5l7 7-7 7"/>
            </svg>
        </button>

        <figure id="lightbox-figure" class="max-w-5xl w-full flex flex-col items-center">
            <img
                id="lightbox-img"
                src=""
                alt=""
                class="max-h-[80vh] max-w-full w-auto object-contain rounded-md shadow-2xl select-none"
            >

            <figcaption
                id="lightbox-caption"
                class="text-[#FFF0D2] font-secondary text-sm md:text-base mt-4 text-center"
            ></figcaption>

            <p
                id="lightbox-counter"
                class="text-white/50 text-xs mt-2 font-secondary"
                aria-live="polite"
            ></p>
        </figure>

    </div>

    <!-- Shared Footer -->
    <div id="footer-placeholder"></div>

</body>
</html>
