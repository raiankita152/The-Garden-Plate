
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu | The Garden Plate</title>
    <meta name="description" content="Explore the food and beverage menu at The Garden Plate.">

    <link rel="icon" type="image/png" href="./images/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./style.css">

    <script src="./js/components.js" defer></script>
    <script src="./js/menu.js" defer></script>
</head>

<body class="bg-[#FAF8F3] font-secondary">

    <!-- Shared Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Hero Section -->
    <section class="relative h-[60vh] md:h-[70vh] overflow-hidden">

        <img
            src="./images/Menu banner.png"
            alt="The Garden Plate menu"
            class="absolute inset-0 w-full h-full object-cover object-center"
            fetchpriority="high">

        <div class="absolute inset-0 bg-black/50"></div>

        <div class="relative z-10 h-full flex flex-col items-center justify-center text-center px-4">

            <h1 class="hero-title font-primary text-[#FFF0D2] text-5xl md:text-7xl font-bold">
                MENU
            </h1>

            <div class="flex justify-center items-center gap-4 mt-4">
                <div class="hero-line w-16 md:w-24 h-[2px] bg-[#A6833E]"></div>

                <img
                    src="./images/menu page vector.png"
                    alt=""
                    aria-hidden="true"
                    class="w-8 h-4 object-contain">

                <div class="hero-line w-16 md:w-24 h-[2px] bg-[#A6833E]"></div>
            </div>

            <p class="text-white text-lg md:text-2xl mt-4">
                A Selection Of Flavours Crafted For You
            </p>
        </div>
    </section>

    <main>
        <!-- Search -->
        <section class="py-10 px-4 bg-white">
            <div class="max-w-5xl mx-auto">
                <label for="searchInput" class="sr-only">Search dishes</label>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search your favourite dish..."
                    autocomplete="off"
                    class="w-full border border-gray-300 rounded-lg px-6 py-4 focus:outline-none focus:border-[#153E17] focus:ring-1 focus:ring-[#153E17]">
            </div>
        </section>

        <!-- Category Filters -->
        <section class="bg-white pb-10">
            <div
                id="menu-filters"
                class="flex flex-wrap justify-center gap-4 px-4"
                aria-label="Filter menu by category">

                <button
                    type="button"
                    class="filter-btn active-filter px-6 py-3 border border-[#153E17] rounded-lg"
                    data-filter="top"
                    aria-pressed="true">
                    Top Dishes
                </button>

                <button
                    type="button"
                    class="filter-btn px-6 py-3 border border-[#153E17] rounded-lg"
                    data-filter="starter"
                    aria-pressed="false">
                    Starters
                </button>

                <button
                    type="button"
                    class="filter-btn px-6 py-3 border border-[#153E17] rounded-lg"
                    data-filter="main"
                    aria-pressed="false">
                    Main Course
                </button>

                <button
                    type="button"
                    class="filter-btn px-6 py-3 border border-[#153E17] rounded-lg"
                    data-filter="dessert"
                    aria-pressed="false">
                    Desserts
                </button>

                <button
                    type="button"
                    class="filter-btn px-6 py-3 border border-[#153E17] rounded-lg"
                    data-filter="beverage"
                    aria-pressed="false">
                    Beverages
                </button>
            </div>
        </section>

        <!-- Menu Cards: generated by menu.js -->
        <section class="py-16 px-4">
            <div
                id="menuContainer"
                class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"
                aria-live="polite">
            </div>

            <p id="noMenuResults" class="hidden text-center text-gray-500 py-10">
                No dishes found. Try another search or category.
            </p>
        </section>
    </main>

    <!-- Shared Footer -->
    <div id="footer-placeholder"></div>

</body>
</html>
